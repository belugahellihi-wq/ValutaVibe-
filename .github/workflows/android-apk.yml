name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'branding/**'

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ValutaVibe APK
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK packages
        shell: bash
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Install project dependencies
        run: npm ci

      - name: Check currency calculations and app flows
        run: npm test

      - name: Build and sync Capacitor
        run: npm run android:sync

      - name: Compile APK
        working-directory: android
        run: bash ./gradlew --no-daemon assembleDebug

      - name: Prepare downloadable APK
        shell: bash
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/ValutaVibe-1.0.0-preview.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose artifacts/ValutaVibe-1.0.0-preview.apk
          cd artifacts
          sha256sum ValutaVibe-1.0.0-preview.apk > SHA256SUMS.txt
          printf '%s\n' 'ValutaVibe — preview APK' '' 'Распакуй архив и открой APK на Android.' 'Это тестовая debug-сборка. Для публикации нужен собственный release keystore.' 'Сборки в разных запусках могут иметь разные debug-подписи: при конфликте обновления удали старую preview-версию (локальные настройки будут потеряны).' > INSTALL.txt

      - name: Upload APK
        id: apk
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ValutaVibe-Android-APK
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Download instructions
        env:
          ARTIFACT_URL: ${{ steps.apk.outputs.artifact-url }}
        run: |
          printf '## ValutaVibe APK готов\n\n[Скачать APK-архив](%s)\n\nНа телефоне или планшете: скачай архив, распакуй его и открой `ValutaVibe-1.0.0-preview.apk`.\n\nЭто preview для проверки, не подписанный релиз для магазина.\n' "$ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
